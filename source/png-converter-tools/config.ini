; PNG to JPG/Web export settings
; Quality: 0-12, Photoshop JPEG quality. 10 is recommended for ecommerce.
Quality=10
; Skip if JPG exists and is newer than or equal to the source PNG.
SkipUpToDate=true
; Set true to regenerate every JPG.
ForceOverwrite=true
; Delete source PNG only after JPG is confirmed successfully generated. Default: false.
DeleteSourcePng=false
; Transparent PNG background: white or black.
TransparentBackground=white
; Keep the embedded ICC profile when possible.
ConvertToSRGB=true
